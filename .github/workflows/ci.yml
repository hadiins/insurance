# Continuous integration for pushes/PRs: the full test suite (needs a real SQL Server — RLS is
# the product's core security boundary and cannot be exercised against an in-memory provider)
# plus a secret-scan gate so a leaked credential fails the build instead of waiting for a tag.
#
# AQSAT_TEST_CONNECTION points the suite at the ephemeral job's service container — its sa
# password is a throwaway value that only ever exists inside this ephemeral runner, which is why
# it can live in source (unlike any real environment's credentials).
#
# AQSAT_BACKUP_DIRECTORY points the backup tests at a directory bind-mounted into the SQL Server
# service container below. BACKUP DATABASE writes server-side, so without the shared mount the
# runner-side assertions can't see the .bak and the two DatabaseBackupJobTests fail. The tests
# still create a GUID-suffixed subdir per case, so they stay isolated from each other.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Sa-Password-9!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
        # Shared with the runner so BACKUP DATABASE (server-side write) lands where the
        # runner-side test assertions can see it. The mssql process inside the service
        # container needs write access; the tests chmod their per-case subdir to 0777.
        volumes:
          - /tmp/aqsat-backup-ci:/tmp/aqsat-backup-ci
    env:
      AQSAT_TEST_CONNECTION: "Server=localhost;Database=AqsatTest;User Id=sa;Password=Ci-Sa-Password-9!;TrustServerCertificate=True;MultipleActiveResultSets=true"
      AQSAT_BACKUP_DIRECTORY: "/tmp/aqsat-backup-ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # The service container starts before any step runs, so the Docker daemon (root)
      # auto-creates this path root-owned — plain chmod would fail with "Operation not
      # permitted". sudo is passwordless on GH-hosted runners.
      - run: |
          sudo mkdir -p /tmp/aqsat-backup-ci
          sudo chmod 777 /tmp/aqsat-backup-ci
      - run: dotnet test tests/Aqsat.UnitTests/Aqsat.UnitTests.csproj --configuration Release

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Same tag-vs-SHA reasoning as release.yml documents: pin only SHAs you have verified
      # upstream; a mistyped SHA is worse than a tag. Enable Dependabot to bump the tag.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
