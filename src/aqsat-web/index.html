<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aqsat-theme');
          var theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          var palette = localStorage.getItem('aqsat-palette') || 'indigo';
          document.documentElement.setAttribute('data-palette', palette);
        } catch (e) {}
      })();
    </script>
    <!-- Vazirmatn is self-hosted: production runs on Iranian shared hosting where
         fonts.googleapis.com is frequently blocked or slow, and the Google-Fonts
         <link> would leave the app rendering in Tahoma. The variable font file
         carries the whole 100-900 weight range CLAUDE.md requires, in one file. -->
    <link rel="preload" href="/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credix | دفتر اقساط</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
