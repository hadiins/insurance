services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
      - sqlserver-backup:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No host port mapping — only the api container reaches SQL Server, over the private compose
    # network. Nothing outside this host can ever see port 1433 (CLAUDE.md: data must stay in Iran,
    # and the smaller the exposed surface the better regardless).

  api:
    # Fixed name, not compose's auto-generated one — Aqsat.Updater's DockerContainerOrchestrator
    # targets this exact container by name (both to recreate it and for its own health-check calls
    # over the compose network), so it must be predictable. This container never mounts the Docker
    # socket and never will — see docs/UPDATE-SYSTEM.md §1 and the "updater" service below.
    container_name: aqsat-api
    build:
      context: .
      dockerfile: src/Aqsat.Api/Dockerfile
      args:
        # Stamped into the image (InformationalVersion) at build time — this is the version the
        # update panel displays and the version-compatibility check reads, straight from the
        # assembly. Set APP_VERSION in .env (e.g. 1.0.0 for the first deployment), or publish
        # updates with scripts/release/publish-local.sh --version x.y.z. There is deliberately no
        # runtime App__Version env var: Aqsat.Updater recreates this container copying the OLD
        # container's env, which would freeze a stale version in place forever.
        APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Dedicated least-privilege login, NOT sa — the app owns the Aqsat database only (migrations
      # need DDL), never the whole server. See README "First run only" for the one-time CREATE LOGIN.
      ConnectionStrings__Default: "Server=sqlserver;Database=Aqsat;User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: ${JWT_KEY}
      Encryption__NationalIdKey: ${NATIONAL_ID_KEY}
      ApiIr__ApiKey: ${API_IR_KEY:-}
      ApiIr__AllowPaidEndpoints: ${API_IR_ALLOW_PAID:-false}
      Backup__Directory: /var/opt/mssql/backup
      Backup__RetentionDays: ${BACKUP_RETENTION_DAYS:-14}
      # docs/TASKS.md Task 22 — the panel's own outbound call to Aqsat.Updater. Same shared token
      # on both sides. (The version the panel shows and the "can't jump straight from 1.0 to 3.0"
      # prerequisite check use is stamped into the image at build time — build.args APP_VERSION
      # above; PlatformUpdatesController reads it from the assembly, never from env.)
      Updater__BaseUrl: http://aqsat-updater:8081
      Updater__SharedToken: ${UPDATER_SHARED_TOKEN}
      # docs/TASKS.md Task 23 — POST /api/platform/updates/register verifies each submitted
      # package's signature server-side (IPackageSignatureVerifier) against this key BEFORE the
      # package reaches the catalog a Platform.Owner sees — the same key the updater verifies
      # with again at apply time. Without it, package registration is refused outright.
      Updater__SigningPublicKeyPem: ${UPDATER_SIGNING_PUBLIC_KEY_PEM:-}
      # One-time secret for POST /api/platform/bootstrap-owner (first Platform.Owner account).
      # Gated in .env as BOOTSTRAP_SECRET; blank it out after the owner account is created.
      Platform__BootstrapSecret: ${BOOTSTRAP_SECRET:-}
    volumes:
      # Shares the same physical files sqlserver writes backups into, so DatabaseBackupJob's
      # retention sweep (plain File I/O, running inside this container) can see and delete them.
      - sqlserver-backup:/var/opt/mssql/backup
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # docs/TASKS.md Task 21 — separate, internal-only service. This is the ONLY place in the whole
  # deployment that mounts the Docker socket; "api" above never does. If a vulnerability were ever
  # found in the internet-facing api container, an attacker who compromised it still could not
  # reach the host through this — there is no code path, credential, or network route from "api" to
  # "updater" other than the narrow, token-authenticated HTTP API updater.md documents.
  updater:
    container_name: aqsat-updater
    build:
      context: .
      dockerfile: src/Aqsat.Updater/Dockerfile
      args:
        # GID of the host's docker.sock group (official Docker packages: 999). The updater joins
        # this group at build time so it can talk to the socket WITHOUT running as root. Check on
        # the host with: stat -c '%g' /var/run/docker.sock — rebuild with DOCKER_GID=<gid> if it
        # differs, or updates will fail with "Permission denied" on the socket.
        DOCKER_GID: ${DOCKER_GID:-999}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__Default: "Server=sqlserver;Database=Aqsat;User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Backup__Directory: /var/opt/mssql/backup
      Updater__SharedToken: ${UPDATER_SHARED_TOKEN}
      Updater__SigningPublicKeyPem: ${UPDATER_SIGNING_PUBLIC_KEY_PEM}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sqlserver-backup:/var/opt/mssql/backup
    depends_on:
      sqlserver:
        condition: service_healthy
    # No "ports:" — reachable only from other containers on this compose network (i.e. "api"),
    # never from the host's public interface, matching docs/UPDATE-SYSTEM.md §1's diagram exactly:
    # "بدون پورت عمومی".

volumes:
  sqlserver-data:
  sqlserver-backup:
